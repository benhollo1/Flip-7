<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip 7 Score Counter</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4572e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column for the phone. Scoreboard with progress to 200, then the round entry card, then history. */
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #5b6678;
  --line: #d9e0e6;
  --accent: #e4572e;
  --accent-ink: #ffffff;
  --good: #1f8a70;
  --gold: #f2b705;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "DM Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --surface: #19232f; --ink: #eef2f6; --muted: #98a4b5;
    --line: #2b3847; --accent: #ff7a50; --accent-ink: #14100d; --good: #46c2a1; --gold: #f5c542;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --surface: #19232f; --ink: #eef2f6; --muted: #98a4b5;
  --line: #2b3847; --accent: #ff7a50; --accent-ink: #14100d; --good: #46c2a1; --gold: #f5c542;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.sub { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; padding: 0 14px; font-weight: 500; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.ghost { background: transparent; }
button:disabled { opacity: 0.45; cursor: default; }
input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 12px; width: 100%; min-width: 0; }
.banner { background: var(--gold); color: #1c1600; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-family: var(--font-display); font-size: 18px; }
.player { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.player .name { font-weight: 700; overflow-wrap: anywhere; }
.player .total { font-family: var(--font-display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1; }
.player.lead .name::after { content: " leading"; color: var(--good); font-weight: 500; font-size: 13px; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
.player.lead .bar i { background: var(--good); }
.entry-row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
.entry-row .name { font-weight: 500; overflow-wrap: anywhere; }
.entry-row .chips { grid-column: 1 / -1; display: flex; gap: 8px; }
.entry-row .chips button { flex: 1; min-height: 40px; font-size: 14px; }
.entry-row + .entry-row { border-top: 1px solid var(--line); padding-top: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .primary { flex: 1; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; color: var(--muted); }
th { font-weight: 700; font-size: 13px; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.plist .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.rules { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 18px; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.3s ease; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Flip <span>7</span> Scores</h1>
    <button id="players-btn" class="ghost" type="button">Players</button>
  </header>
  <div id="app"></div>
</main>
<script>
(function () {
  var KEY = "flip7-state-v1";
  var BONUS = 15;
  var state = { players: ["Player 1", "Player 2", "Player 3"], rounds: [], target: 200 };
  var draft = [];
  var editing = false;

  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.players) && Array.isArray(saved.rounds) && saved.players.length >= 2) state = saved;
  } catch (e) {}

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function totals() {
    return state.players.map(function (_, i) {
      return state.rounds.reduce(function (a, r) { return a + (r[i] || 0); }, 0);
    });
  }
  function parseScore(v) { var n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : n; }

  function banner(t) {
    var max = Math.max.apply(null, t);
    if (state.rounds.length === 0 || max < state.target) return "";
    var leaders = [];
    t.forEach(function (v, i) { if (v === max) leaders.push(i); });
    if (leaders.length === 1) return '<div class="banner">' + esc(state.players[leaders[0]]) + " wins with " + max + ". Start a new game when you are ready.</div>";
    return '<div class="banner">Tied on ' + max + ". Play another round to break the tie.</div>";
  }

  function boardHtml(t) {
    var max = Math.max.apply(null, t);
    return '<section class="card" aria-label="Scoreboard"><div class="sub">First to ' + state.target + " or more wins. Round " + (state.rounds.length + 1) + " next.</div>" +
      state.players.map(function (p, i) {
        var pct = Math.min(100, Math.round((t[i] / state.target) * 100));
        var lead = state.rounds.length > 0 && t[i] === max && max > 0;
        return '<div class="player' + (lead ? " lead" : "") + '"><div class="name">' + esc(p) + '</div><div class="total">' + t[i] + '</div><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + state.target + '" aria-valuenow="' + t[i] + '"><i style="width:' + pct + '%"></i></div></div>';
      }).join("") + "</section>";
  }

  function entryHtml() {
    return '<section class="card" aria-label="Add round"><h2>Round ' + (state.rounds.length + 1) + '</h2><div class="sub">Enter each player\'s score for the round. Leave blank for a bust.</div>' +
      state.players.map(function (p, i) {
        return '<div class="entry-row"><label class="name" for="s' + i + '">' + esc(p) + '</label>' +
          '<input id="s' + i + '" data-i="' + i + '" type="number" inputmode="numeric" min="0" placeholder="0" value="' + esc(draft[i] || "") + '">' +
          '<div class="chips"><button type="button" data-act="bust" data-i="' + i + '">Bust (0)</button><button type="button" data-act="bonus" data-i="' + i + '">Flip 7 bonus +' + BONUS + '</button></div></div>';
      }).join("") +
      '<div class="actions"><button type="button" class="primary" data-act="add">Add round</button><button type="button" data-act="undo"' + (state.rounds.length ? "" : " disabled") + '>Undo last round</button></div></section>';
  }

  function historyHtml() {
    if (!state.rounds.length) return "";
    var head = "<tr><th>Round</th>" + state.players.map(function (p) { return "<th>" + esc(p) + "</th>"; }).join("") + "</tr>";
    var rows = state.rounds.map(function (r, n) {
      return "<tr><td>" + (n + 1) + "</td>" + state.players.map(function (_, i) { return "<td>" + (r[i] || 0) + "</td>"; }).join("") + "</tr>";
    }).reverse().join("");
    return '<section class="card" aria-label="Round history"><h2>Rounds</h2><div class="scroll"><table>' + head + rows + "</table></div></section>";
  }

  function rulesHtml() {
    return '<section class="card"><h2>Scoring reminder</h2><ul class="rules"><li>Add up your number cards.</li><li>A x2 card doubles the number card total only.</li><li>Then add any +2, +4, +6, +8 or +10 cards.</li><li>Seven different number cards earns +' + BONUS + '.</li><li>A bust scores 0.</li></ul></section>';
  }

  function playersHtml() {
    var canRemove = state.rounds.length === 0 && state.players.length > 2;
    return '<section class="card"><h2>Players</h2><div class="plist">' +
      state.players.map(function (p, i) {
        return '<div class="row"><input aria-label="Player ' + (i + 1) + ' name" data-name="' + i + '" value="' + esc(p) + '" maxlength="20">' +
          (canRemove ? '<button type="button" data-act="remove" data-i="' + i + '">Remove</button>' : "") + "</div>";
      }).join("") + '</div>' +
      '<div class="actions"><button type="button" data-act="addplayer"' + (state.players.length >= 12 ? " disabled" : "") + '>Add player</button><button type="button" class="primary" data-act="done">Done</button></div>' +
      '<div class="sub">Players can only be removed before the first round is scored.</div>' +
      '<hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="actions"><button type="button" data-act="newgame">New game, same players</button></div></section>';
  }

  var app = document.getElementById("app");
  function render() {
    var t = totals();
    app.style.display = "flex"; app.style.flexDirection = "column"; app.style.gap = "16px";
    if (editing) { app.innerHTML = playersHtml(); return; }
    app.innerHTML = banner(t) + boardHtml(t) + entryHtml() + historyHtml() + rulesHtml();
  }

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset.i !== undefined && el.type === "number") draft[+el.dataset.i] = el.value;
    if (el.dataset.name !== undefined) { state.players[+el.dataset.name] = el.value || "Player " + (+el.dataset.name + 1); save(); }
  });

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !b.dataset.act) return;
    var i = +b.dataset.i, act = b.dataset.act;
    if (act === "bust") { draft[i] = "0"; document.getElementById("s" + i).value = "0"; }
    else if (act === "bonus") { var v = parseScore(draft[i]) + BONUS; draft[i] = String(v); document.getElementById("s" + i).value = v; }
    else if (act === "add") {
      state.rounds.push(state.players.map(function (_, k) { return parseScore(draft[k]); }));
      draft = []; save(); render(); window.scrollTo(0, 0);
    }
    else if (act === "undo") { state.rounds.pop(); save(); render(); }
    else if (act === "addplayer") { state.players.push("Player " + (state.players.length + 1)); save(); render(); }
    else if (act === "remove") { state.players.splice(i, 1); draft = []; save(); render(); }
    else if (act === "done") { editing = false; render(); }
    else if (act === "newgame") {
      if (b.dataset.armed) { state.rounds = []; draft = []; editing = false; save(); render(); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to clear all scores"; }
    }
  });

  document.getElementById("players-btn").addEventListener("click", function () { editing = !editing; render(); });
  render();
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
})();
</script>
</body>
</html>

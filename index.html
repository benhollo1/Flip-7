<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flip 7 Score Counter</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4572e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one column for the phone. Scoreboard with progress to 200, then the round entry card, then history. */
:root {
  --bg: #f1f4f6;
  --surface: #ffffff;
  --ink: #14213d;
  --muted: #5b6678;
  --line: #d9e0e6;
  --accent: #e4572e;
  --accent-ink: #ffffff;
  --good: #1f8a70;
  --gold: #f2b705;
  --c0: #2563eb; --c1: #e4572e; --c2: #1f8a70; --c3: #8b5cf6; --c4: #b7791f; --c5: #d6336c; --c6: #475569; --c7: #0891b2;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
  --font-body: "DM Sans", "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --surface: #19232f; --ink: #eef2f6; --muted: #98a4b5;
    --line: #2b3847; --accent: #ff7a50; --accent-ink: #14100d; --good: #46c2a1; --gold: #f5c542;
    --c0: #6ea0ff; --c1: #ff7a50; --c2: #46c2a1; --c3: #b69cff; --c4: #f5c542; --c5: #ff7ba6; --c6: #a9b6c8; --c7: #4cc9e0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --surface: #19232f; --ink: #eef2f6; --muted: #98a4b5;
  --line: #2b3847; --accent: #ff7a50; --accent-ink: #14100d; --good: #46c2a1; --gold: #f5c542;
  --c0: #6ea0ff; --c1: #ff7a50; --c2: #46c2a1; --c3: #b69cff; --c4: #f5c542; --c5: #ff7ba6; --c6: #a9b6c8; --c7: #4cc9e0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.4; }
main { max-width: 520px; margin: 0 auto; padding: 16px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 28px; margin: 0; letter-spacing: -0.02em; text-wrap: balance; }
h1 span { color: var(--accent); }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 18px; margin: 0; }
.sub { color: var(--muted); font-size: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
button { font: inherit; cursor: pointer; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-height: 44px; padding: 0 14px; font-weight: 500; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
button.ghost { background: transparent; }
button:disabled { opacity: 0.45; cursor: default; }
input { font: inherit; font-size: 16px; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; min-height: 44px; padding: 0 12px; width: 100%; min-width: 0; }
.banner { background: var(--gold); color: #1c1600; border-radius: 14px; padding: 14px 16px; font-weight: 700; font-family: var(--font-display); font-size: 18px; }
.player { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: baseline; }
.player .name { font-weight: 700; overflow-wrap: anywhere; }
.player .total { font-family: var(--font-display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; line-height: 1; }
.player.lead .name::after { content: " leading"; color: var(--good); font-weight: 500; font-size: 13px; }
.bar { grid-column: 1 / -1; height: 8px; border-radius: 99px; background: var(--bg); overflow: hidden; border: 1px solid var(--line); }
.bar i { display: block; height: 100%; background: var(--accent); }
.entry-row { display: grid; grid-template-columns: 1fr 96px; gap: 8px; align-items: center; }
.entry-row .name { font-weight: 500; overflow-wrap: anywhere; }
.entry-row .chips { grid-column: 1 / -1; display: flex; gap: 8px; }
.entry-row .chips button { flex: 1; min-height: 40px; font-size: 14px; }
.entry-row + .entry-row { border-top: 1px solid var(--line); padding-top: 12px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.actions .primary { flex: 1; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; font-size: 15px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; color: var(--muted); }
th { font-weight: 700; font-size: 13px; }
.plist { display: flex; flex-direction: column; gap: 8px; }
.plist .row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.rules { color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; margin: 0; padding-left: 18px; }
button[aria-pressed="true"] { background: var(--good); color: var(--accent-ink); border-color: var(--good); }
.bbtns { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.banner button {  background: #1c1600; color: #fff; border-color: #1c1600; }
.msg { color: var(--accent); font-size: 14px; min-height: 0; }
.stats { grid-column: 1 / -1; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.seg { display: flex; gap: 8px; }
.seg button { flex: 1; min-height: 40px; font-size: 14px; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font-body); font-variant-numeric: tabular-nums; }
.chart .target { stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 5 4; }
.chart .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; overflow-wrap: anywhere; }
.legend i { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.3s ease; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Flip <span>7</span> Scores</h1>
    <button id="players-btn" class="ghost" type="button">Players</button>
  </header>
  <div id="app"></div>
</main>
<script>
(function () {
  var KEY = "flip7-state-v1";
  var BONUS = 15, MAX_ROUND = 300;
  var state = { players: ["Player 1", "Player 2", "Player 3"], rounds: [], target: 200, draft: { v: [], b: [] } };
  var editing = false;

  try {
    var saved = JSON.parse(localStorage.getItem(KEY));
    if (saved && Array.isArray(saved.players) && Array.isArray(saved.rounds) && saved.players.length >= 2) {
      state = saved;
      if (!state.target) state.target = 200;
    }
  } catch (e) {}
  if (!state.draft || !Array.isArray(state.draft.v) || !Array.isArray(state.draft.b)) state.draft = { v: [], b: [] };

  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function totals() {
    return state.players.map(function (_, i) {
      return state.rounds.reduce(function (a, r) { return a + (r[i] || 0); }, 0);
    });
  }
  function parseScore(v) { var n = parseInt(v, 10); return isNaN(n) || n < 0 ? 0 : Math.min(n, MAX_ROUND); }
  function clearDraft() { state.draft = { v: [], b: [] }; }
  function bonusLabel(i) { return state.draft.b[i] ? "Bonus added, tap to remove" : "Flip 7 bonus +" + BONUS; }

  function banner(t) {
    var max = Math.max.apply(null, t);
    if (state.rounds.length === 0 || max < state.target) return "";
    var leaders = [];
    t.forEach(function (v, i) { if (v === max) leaders.push(i); });
    var msg = leaders.length === 1
      ? esc(state.players[leaders[0]]) + " wins with " + max + "."
      : "Tied on " + max + ". Play another round to break the tie.";
    var btn = leaders.length === 1 ? '<div class="bbtns"><button type="button" data-act="newgame">New game</button><button type="button" data-act="newplayers">New players</button></div>' : "";
    return '<div class="banner" role="status">' + msg + btn + "</div>";
  }

  function boardHtml(t) {
    var max = Math.max.apply(null, t);
    return '<section class="card" aria-label="Scoreboard"><div class="sub">First to ' + state.target + " or more wins. Round " + (state.rounds.length + 1) + " next.</div>" +
      state.players.map(function (p, i) {
        var pct = Math.min(100, Math.round((t[i] / state.target) * 100));
        var lead = state.rounds.length > 0 && t[i] === max && max > 0;
        return '<div class="player' + (lead ? " lead" : "") + '"><div class="name">' + esc(p) + '</div><div class="total">' + t[i] + '</div><div class="bar" role="progressbar" aria-label="' + esc(p) + ' progress" aria-valuemin="0" aria-valuemax="' + state.target + '" aria-valuenow="' + t[i] + '"><i style="width:' + pct + '%;background:var(--c' + (i % 8) + ')"></i></div>' + statsHtml(t, i, max) + '</div>';
      }).join("") + "</section>";
  }


  function fmt(x) { return String(Math.round(x * 10) / 10); }
  function statsHtml(t, i, max) {
    var n = state.rounds.length, toGo = Math.max(0, state.target - t[i]);
    var a = toGo === 0 ? "Reached " + state.target : toGo + " points to go";
    if (n > 0 && max > 0) {
      if (t[i] === max) {
        var second = Math.max.apply(null, t.filter(function (_, k) { return k !== i; }));
        a += second === max ? " · tied for the lead" : " · leads by " + (max - second);
      } else a += " · " + (max - t[i]) + " to catch the leader";
    }
    var b = "";
    if (n > 0) {
      var avg = t[i] / n;
      b = "avg " + fmt(avg) + "/round";
      if (n >= 4) {
        var last = state.rounds.slice(-3).reduce(function (s, r) { return s + (r[i] || 0); }, 0) / 3;
        b += " · last 3: " + fmt(last);
      }
      if (toGo > 0 && avg > 0) { var need = Math.ceil(toGo / avg); b += " · about " + need + " more round" + (need === 1 ? "" : "s"); }
    }
    return '<div class="stats"><div>' + a + "</div>" + (b ? "<div>" + b + "</div>" : "") + "</div>";
  }

  function niceStep(maxVal) {
    var steps = [5, 10, 20, 25, 50, 100, 200];
    for (var k = 0; k < steps.length; k++) if (maxVal / steps[k] <= 5) return steps[k];
    return 200;
  }

  function chartHtml() {
    var n = state.rounds.length;
    if (!n) return "";
    var mode = state.chartMode === "round" ? "round" : "total";
    var W = 360, H = 230, L = 36, R = 14, T = 12, B = 26;
    var series = state.players.map(function (_, i) {
      var pts = [], run = 0;
      if (mode === "total") pts.push(0);
      state.rounds.forEach(function (r) { var v = r[i] || 0; run += v; pts.push(mode === "total" ? run : v); });
      return pts;
    });
    var xMin = mode === "total" ? 0 : 1, xMax = Math.max(n, xMin + 1);
    var maxVal = Math.max.apply(null, [].concat.apply([], series));
    var yMax = mode === "total" ? Math.max(state.target, maxVal) : Math.max(10, maxVal);
    var step = niceStep(yMax);
    yMax = Math.ceil(yMax / step) * step;
    function X(v) { return L + ((v - xMin) / (xMax - xMin)) * (W - L - R); }
    function Y(v) { return T + (1 - v / yMax) * (H - T - B); }
    var g = "";
    for (var v = 0; v <= yMax; v += step) {
      g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>' +
           '<text class="tick" x="' + (L - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' + v + "</text>";
    }
    var every = Math.ceil(n / 8);
    for (var r = xMin; r <= n; r += (r === 0 ? 1 : every)) {
      if (r !== 0 && (r - 1) % every !== 0 && mode === "round") continue;
      g += '<text class="tick" x="' + X(r).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + r + "</text>";
    }
    if (mode === "total") {
      g += '<line class="target" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(state.target).toFixed(1) + '" y2="' + Y(state.target).toFixed(1) + '"/>' +
           '<text class="tick" x="' + (L + 4) + '" y="' + (Y(state.target) - 4).toFixed(1) + '">Target ' + state.target + "</text>";
    }
    var lines = series.map(function (pts, i) {
      var col = "var(--c" + (i % 8) + ")", dash = i >= 8 ? ' stroke-dasharray="5 3"' : "";
      var xs = pts.map(function (val, k) { return [X(xMin + k), Y(val)]; });
      var path = xs.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ");
      var dots = xs.map(function (p, k) {
        return '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (k === xs.length - 1 ? 4 : 2.5) + '" style="fill:' + col + '"/>';
      }).join("");
      return '<polyline class="line" points="' + path + '" style="stroke:' + col + '"' + dash + "/>" + dots;
    }).join("");
    var legend = state.players.map(function (p, i) {
      return '<span><i style="background:var(--c' + (i % 8) + ')"></i>' + esc(p) + "</span>";
    }).join("");
    var label = mode === "total" ? "Total score after each round" : "Points scored in each round";
    return '<section class="card chart" aria-label="Score chart"><h2>Trend</h2>' +
      '<div class="seg"><button type="button" data-act="chartmode" data-mode="total" aria-pressed="' + (mode === "total") + '">Total score</button>' +
      '<button type="button" data-act="chartmode" data-mode="round" aria-pressed="' + (mode === "round") + '">Points per round</button></div>' +
      '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + label + ' for each player. The table below lists the same numbers.">' + g + lines + "</svg>" +
      '<div class="sub">' + label + ". Round number along the bottom.</div>" +
      '<div class="legend">' + legend + "</div></section>";
  }

  function entryHtml() {
    return '<section class="card" aria-label="Add round"><h2>Round ' + (state.rounds.length + 1) + '</h2><div class="sub">Enter each player\'s score for the round. A bust scores 0.</div>' +
      state.players.map(function (p, i) {
        return '<div class="entry-row"><label class="name" for="s' + i + '">' + esc(p) + '</label>' +
          '<input id="s' + i + '" data-i="' + i + '" type="number" inputmode="numeric" enterkeyhint="next" min="0" max="' + MAX_ROUND + '" placeholder="0" value="' + esc(state.draft.v[i] || "") + '">' +
          '<div class="chips"><button type="button" data-act="bust" data-i="' + i + '">Bust (0)</button><button type="button" id="b' + i + '" data-act="bonus" data-i="' + i + '" aria-pressed="' + (state.draft.b[i] ? "true" : "false") + '">' + bonusLabel(i) + '</button></div></div>';
      }).join("") +
      '<div id="msg" class="msg" role="alert"></div>' +
      '<div class="actions"><button type="button" class="primary" data-act="add">Add round</button><button type="button" data-act="undo"' + (state.rounds.length ? "" : " disabled") + '>Undo last round</button></div></section>';
  }

  function historyHtml() {
    if (!state.rounds.length) return "";
    var head = "<tr><th>Round</th>" + state.players.map(function (p) { return "<th>" + esc(p) + "</th>"; }).join("") + "</tr>";
    var rows = state.rounds.map(function (r, n) {
      return "<tr><td>" + (n + 1) + "</td>" + state.players.map(function (_, i) { return "<td>" + (r[i] || 0) + "</td>"; }).join("") + "</tr>";
    }).reverse().join("");
    return '<section class="card" aria-label="Round history"><h2>Rounds</h2><div class="scroll"><table>' + head + rows + "</table></div></section>";
  }

  function rulesHtml() {
    return '<section class="card"><h2>Scoring reminder</h2><ul class="rules"><li>Add up your number cards.</li><li>A x2 card doubles the number card total only.</li><li>Then add any +2, +4, +6, +8 or +10 cards.</li><li>Seven different number cards earns +' + BONUS + '.</li><li>A bust scores 0.</li><li>The game ends when someone reaches ' + state.target + '. Ties at the top play another round.</li></ul></section>';
  }

  function playersHtml() {
    var canRemove = state.rounds.length === 0 && state.players.length > 2;
    return '<section class="card"><h2>Players</h2><div class="plist">' +
      state.players.map(function (p, i) {
        return '<div class="row"><input aria-label="Player ' + (i + 1) + ' name" data-name="' + i + '" value="' + esc(p) + '" maxlength="20">' +
          (canRemove ? '<button type="button" data-act="remove" data-i="' + i + '">Remove</button>' : "") + "</div>";
      }).join("") + '</div>' +
      '<div class="actions"><button type="button" data-act="addplayer"' + (state.players.length >= 12 ? " disabled" : "") + '>Add player</button><button type="button" class="primary" data-act="done">Done</button></div>' +
      '<div class="sub">Players can only be removed before the first round is scored.</div>' +
      '<hr style="border:0;border-top:1px solid var(--line);width:100%"><div class="actions"><button type="button" data-act="newgame">New game, same players</button><button type="button" data-act="newplayers">New game, new players</button></div></section>';
  }

  var app = document.getElementById("app");
  function render() {
    var t = totals();
    app.style.display = "flex"; app.style.flexDirection = "column"; app.style.gap = "16px";
    if (editing) { app.innerHTML = playersHtml(); return; }
    app.innerHTML = banner(t) + boardHtml(t) + entryHtml() + chartHtml() + historyHtml() + rulesHtml();
  }

  function setBonusButton(i) {
    var bb = document.getElementById("b" + i);
    if (!bb) return;
    bb.textContent = bonusLabel(i);
    bb.setAttribute("aria-pressed", state.draft.b[i] ? "true" : "false");
  }

  app.addEventListener("input", function (e) {
    var el = e.target;
    if (el.dataset.i !== undefined && el.type === "number") { state.draft.v[+el.dataset.i] = el.value; save(); }
    if (el.dataset.name !== undefined) { state.players[+el.dataset.name] = el.value.trim() || "Player " + (+el.dataset.name + 1); save(); }
  });

  app.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset.name !== undefined && !el.value.trim()) el.value = state.players[+el.dataset.name];
  });

  app.addEventListener("keydown", function (e) {
    var el = e.target;
    if (e.key === "Enter" && el.dataset.i !== undefined && el.type === "number") {
      e.preventDefault();
      var next = document.getElementById("s" + (+el.dataset.i + 1));
      if (next) next.focus(); else el.blur();
    }
  });

  app.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b || !b.dataset.act) return;
    var i = +b.dataset.i, act = b.dataset.act;
    if (act === "bust") {
      state.draft.v[i] = "0"; state.draft.b[i] = false;
      document.getElementById("s" + i).value = "0"; setBonusButton(i); save();
    }
    else if (act === "bonus") {
      var cur = parseScore(state.draft.v[i]);
      if (state.draft.b[i]) { cur = Math.max(0, cur - BONUS); state.draft.b[i] = false; }
      else { cur = Math.min(MAX_ROUND, cur + BONUS); state.draft.b[i] = true; }
      state.draft.v[i] = String(cur);
      document.getElementById("s" + i).value = cur; setBonusButton(i); save();
    }
    else if (act === "add") {
      var any = state.players.some(function (_, k) { var v = state.draft.v[k]; return v !== undefined && v !== ""; });
      if (!any) { document.getElementById("msg").textContent = "Enter at least one score first. Use Bust (0) for a bust."; return; }
      state.rounds.push(state.players.map(function (_, k) { return parseScore(state.draft.v[k]); }));
      clearDraft(); save(); render(); window.scrollTo(0, 0);
    }
    else if (act === "undo") { state.rounds.pop(); save(); render(); }
    else if (act === "addplayer") { state.players.push("Player " + (state.players.length + 1)); save(); render(); }
    else if (act === "remove") { state.players.splice(i, 1); clearDraft(); save(); render(); }
    else if (act === "done") { editing = false; render(); }
    else if (act === "chartmode") { state.chartMode = b.dataset.mode === "round" ? "round" : "total"; save(); render(); }
    else if (act === "newplayers") {
      if (b.dataset.armed) { state.players = ["Player 1", "Player 2", "Player 3"]; state.rounds = []; clearDraft(); editing = true; save(); render(); window.scrollTo(0, 0); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to clear scores and players"; }
    }
    else if (act === "newgame") {
      if (b.dataset.armed) { state.rounds = []; clearDraft(); editing = false; save(); render(); window.scrollTo(0, 0); }
      else { b.dataset.armed = "1"; b.textContent = "Tap again to clear all scores"; }
    }
  });

  document.getElementById("players-btn").addEventListener("click", function () { editing = !editing; render(); });
  render();
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
})();
</script>
</body>
</html>
